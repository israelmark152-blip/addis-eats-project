<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birr Watch - Mini Project</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-card">
    <header>
      <h1>Birr Watch</h1>
      <p id="status" class="status-message"></p>
    </header>

    <main>
      <!-- Currency Converter Form -->
      <form id="convert-form" class="form-container">
        <div class="input-group">
          <label for="amount">Amount (ETB)</label>
          <input type="number" id="amount" placeholder="e.g. 100" step="any">
        </div>

        <div class="input-group">
          <label for="currency">Target Currency</label>
          <select id="currency"></select>
        </div>

        <div class="button-group">
          <button type="submit" class="btn btn-primary">Convert</button>
          <button type="button" id="watch-btn" class="btn btn-secondary">+ Watchlist</button>
        </div>
      </form>

      <!-- Conversion Output Display -->
      <div id="result" class="result-display"></div>

      <!-- Watchlist Section -->
      <section class="watchlist-section">
        <h2>Saved Watchlist</h2>
        <ul id="watchlist" class="watchlist-items"></ul>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
