<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us | Habesha Eatery</title>
  <meta name="description" content="Get in touch with Habesha Eatery in Bole, Addis Ababa. View opening hours and send us a message[cite: 3].">
</head>
<body>

  <header>
    <h1>Contact Habesha Eatery</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home & Menu</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- Day 12 Feature: Contact Form -->
    <section>
      <h2>Send Us a Message</h2>
      <form action="/contact" method="post">
        <fieldset>
          <legend>Contact Form</legend>

          <div>
            <label for="contact-name">Name</label>
            <input id="contact-name" name="name" type="text" required>
          </div>

          <div>
            <label for="contact-email">Email</label>
            <input id="contact-email" name="email" type="email" required>
          </div>

          <div>
            <label for="contact-msg">Message</label>
            <textarea id="contact-msg" name="message" rows="4" required></textarea>
          </div>

          <button type="submit">Send Message</button>
        </fieldset>
      </form>
    </section>

    <!-- Day 12 Feature: Opening Hours Table -->
    <section>
      <h2>Opening Hours</h2>
      <table>
        <caption>Habesha Eatery Weekly Operating Hours</caption>
        <thead>
          <tr>
            <th scope="col">Day</th>
            <th scope="col">Hours</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">Monday – Friday</th>
            <td>8:30 AM – 10:00 PM</td>
          </tr>
          <tr>
            <th scope="row">Saturday</th>
            <td>9:00 AM – 11:00 PM</td>
          </tr>
          <tr>
            <th scope="row">Sunday</th>
            <td>10:00 AM – 9:00 PM</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <footer>
    <p>Bole, Addis Ababa · Phone: +251 911 234 567[cite: 3]</p>
  </footer>

</body>
</html>
