<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 21 In-Class Exercise</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 400px; margin: 2rem auto; padding: 0 1rem; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.25rem; font-weight: 600; }
    input { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { padding: 0.5rem 1rem; background: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .error { color: #d9534f; margin-top: 1rem; min-height: 1.2em; font-size: 0.9rem; }
    .count { margin-bottom: 1rem; font-weight: bold; background: #e9ecef; padding: 0.5rem; border-radius: 4px; }
  </style>
</head>
<body>

  <div id="signup-count" class="count">Signed up count: 0</div>

  <form id="signup-form">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="e.g. Almaz Bekele">
    </div>
    
    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input type="text" id="phone" placeholder="e.g. 0912345678 or +251912345678">
    </div>

    <button type="submit">Submit</button>
  </form>

  <div id="error" class="error"></div>

  <script src="app.js"></script>
</body>
</html>
