<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Addis Eats | Admin Portal</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="login-body">

  <div class="login-card">
    <h2>Admin Login</h2>
    <p>Sign in to manage dishes and view customer orders.</p>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter admin username" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required />
      </div>

      <p id="error-msg" class="error-msg hidden">Invalid username or password.</p>

      <button type="submit" class="login-btn">Sign In</button>
    </form>
    
    <a href="index.html" class="back-link">← Back to Main Menu</a>
  </div>

  <script src="admin-login.js"></script>
</body>
</html>
